<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таймер</title>
</head>
<body>
    <h1>Обратный отсчет:</h1>
    <h2 id="timerDisplay" style="font-size: 50px; color: red;">...</h2>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let timeLeft = parseInt(urlParams.get('time'));
        const display = document.getElementById('timerDisplay');

        if (isNaN(timeLeft)) timeLeft = 0;

        display.innerText = timeLeft;

        if (timeLeft > 0) {
            const timer = setInterval(() => {
                timeLeft = timeLeft - 1; 
                display.innerText = timeLeft; 

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    display.innerText = "Время вышло!";
                    display.style.color = "red";
                }
            }, 1000);
        }
    </script>
</body>
</html>
